sections:
    main:
        title: About
        rows:
            - content: The Webcam Coastal Observation System (WebCOOS) project is being implemented by SECOORA and its partners with funding from NOAA.  The team is developing a webcam coastal observing network for quantitative scientific analysis, public safety, and resource management for coastal municipalities, scientists, and local communities. To accomplish this, standardized data processing and management methodology will be established to provide stakeholders with actionable information from webcam videos.  SECOORA is working to transfer this methodology nationwide across all 11 IOOS regional associations.
            - content: |
                ### Installation

                For additional details about installing a webcam in your local community, see these resources:

                - [Outreach Flyer (2025)](/webcoos_Outreach_Package_2025.pdf)
                - [Outreach Story Map (2025)](https://storymaps.arcgis.com/stories/1e3b6fbfab2d4d83971ec040ff168f40)
                - [2-page Outreach Flyer (2025)](/2025_webcoos_Two_Pager_national.pdf)
                - [Outreach Flyer (2022)](https://secoora.org/wp-content/uploads/2022/08/webcoos-Outreach-Package.pdf)

            - content: |
                ### Additional Resources

                - [Report from Web Cameras for Environmental Monitoring Workshop – November 14-15, 2018](https://secoora.org/webcams-for-environmental-monitoring-workshop-2018/)

                - [Scientific Paper: Automated Rip Current Detection with Region based Convolutional Neural Networks](https://secoora.org/wp-content/uploads/2021/04/Automated-Rip-Current-Detection-with-Region-based-Convolutional-Neural-Networks.pdf)

                - [WebCOOS organization on Github](https://github.com/webcoos/), including repos for:
                  * [py-webcoos-client](https://github.com/WebCOOS/py-webcoos-client), a Python wrapper for the WebCOOS API.
                  * [rip_current_detect](https://github.com/WebCOOS/rip_current_detection), an API used by WebCOOS for rip current detection.
                  * [seal_detection](https://github.com/WebCOOS/seal_detection), an API used by WebCOOS for seal detection.
                  * [webcoos_object_detection](https://github.com/WebCOOS/webcoos_object_detection), an API used by WebCOOS for general object detection.

