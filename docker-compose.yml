services:

  app:
    image: "webcoos-project-site:latest"
    build:
      context:    .
      dockerfile: Dockerfile
      args:
        # WebCOOS API Token
        - "VITE_PUBLIC_WEBCOOS_API_TOKEN=${VITE_PUBLIC_WEBCOOS_API_TOKEN}"
        # WebCOOS API URL
        - "VITE_PUBLIC_WEBCOOS_API_URL=${VITE_PUBLIC_WEBCOOS_API_URL}"
        # Feedback URLs
        - "VITE_PUBLIC_FEEDBACK_URL=${VITE_PUBLIC_FEEDBACK_URL}"
    ports:
     - 6173:80
